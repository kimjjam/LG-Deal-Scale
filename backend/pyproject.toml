[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "directdesk-api"
version = "0.1.0"
description = "LG ELECTRONICS PARTNER PORTAL CRM API"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.3,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "slowapi>=0.1.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqlglot>=30.14,<31",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["app*"]
